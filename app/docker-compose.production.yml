name: paopao-checkin-manager

services:
  manager:
    container_name: paopao-checkin-manager
    image: paopao-checkin-manager:0.8.0
    build:
      context: ..
      dockerfile: app/Dockerfile
    restart: unless-stopped
    init: true
    shm_size: "1gb"
    ports:
      - "127.0.0.1:8787:8787"
    environment:
      NODE_ENV: production
      CHECKIN_MODE: production
      CHECKIN_MANAGER_HOST: 0.0.0.0
      CHECKIN_MANAGER_PORT: "8787"
      CHECKIN_PUBLIC_ORIGIN: "${CHECKIN_PUBLIC_ORIGIN:-}"
      CHECKIN_FEATURE_QUEUE: "${CHECKIN_FEATURE_QUEUE:-false}"
      CHECKIN_FEATURE_SESSION: "${CHECKIN_FEATURE_SESSION:-false}"
      CHECKIN_FEATURE_HTTP_FLOW: "${CHECKIN_FEATURE_HTTP_FLOW:-false}"
      CHECKIN_ALLOW_REGISTRATION: "${CHECKIN_ALLOW_REGISTRATION:-false}"
      TZ: Asia/Shanghai
    volumes:
      - ./data:/app/manager/data
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8787/api/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s
    networks:
      - checkin-net

networks:
  checkin-net:
    external: true
    name: checkin-net
